name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODULE_ID: worldbuildingtome-bridge
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify module.json version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version module.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match module.json version $manifest"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm ci && npm test

      - name: Build module.zip
        run: |
          mkdir -p build/"$MODULE_ID"
          # Allowlist, not excludes: the repo now carries dev-only tooling
          # (package.json, tests/, node_modules/) that must not ship.
          cp -R module.json lang styles scripts LICENSE README.md build/"$MODULE_ID"/
          ( cd build && zip -rq module.zip "$MODULE_ID" )
          cp module.json build/module.json

      - name: Publish release assets
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/module.json build/module.zip --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              build/module.json build/module.zip
          fi
